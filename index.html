      #preloader .b { fill: #410FA0; } #preloader .p { fill: #0E0E10; } #preloader .f { opacity: .14; }
      #preloader .t { letter-spacing: .28em; text-transform: uppercase; font-size: 11px; }
      .dark #preloader { background: #0e0e10; color: #a0a0ab; }
      .dark #preloader .b { fill: #8B63E7; } .dark #preloader .p { fill: #FFFFFF; }
