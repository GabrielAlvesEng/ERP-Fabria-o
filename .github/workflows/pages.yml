name: Publicar ERP no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Configure VITE_SUPABASE_URL nas variables do Actions"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Configure VITE_SUPABASE_ANON_KEY nas variables do Actions"; exit 1; }
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
        env:
          VITE_BASE_PATH: /ERP-Fabria-o/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
